[agent]
# Polling interval for price/engine ticks. Affects borrow fee accrual (BUG-001 fix).
poll_interval_secs = 300
log_level = "info"

[flash]
api_url = "https://flashapi.trade"
rpc_url = "https://api.mainnet-beta.solana.com"
keypair_path = "~/.config/solana/id.json"
# Default market for single-strategy mode. For multi-market, use --markets CLI flag.
# Market selection informed by: cargo run --bin scan-markets -- --output data/market-rankings.json
market = "SOL"
input_token = "USDC"
pool = "Crypto.1"
leverage = 3.0
slippage_pct = "0.5"

[strategy]
# Active strategy name (used when --strategies flag is not provided)
active = "momentum-scalper"
# Direction filter: "long", "short", or "neutral" (both directions allowed)
direction_bias = "neutral"
# Velocity threshold (%) for momentum detection
# Source: placeholder value; data-driven version in [strategy.blueprint-scalper] uses cluster-001 data
momentum_threshold_pct = 0.15
# Number of historical price points for velocity computation
lookback_count = 60
scale_in_clips = 1
# Default position size in USD
clip_size_usd = 1000.0
# Maximum hold duration before time-stop triggers
max_hold_secs = 1200
# Take-profit threshold (% gain from entry)
take_profit_pct = 1.0
# Stop-loss threshold (% loss from entry)
stop_loss_pct = 0.5
# Trailing stop: percentage retracement from peak that triggers exit
trailing_stop_pct = 0.3
# Trailing stop activation: minimum peak profit (%) before trailing activates
trailing_activation_pct = 0.5
cooldown_after_loss_secs = 300
use_native_tp_sl = true

# LP Consumption Detector strategy
# Blueprint source: data/strategy-blueprints/lp-consumer.json
[strategy.lp-consumption]
# Entry: detect when a single LP's depth is being consumed in one direction
# From blueprint: entry.threshold_pct = 0.5
consumption_velocity_threshold = 0.5
# From blueprint: entry.confirmation = "consumption_directional >= 70%"
lp_concentration_min = 0.7
# Number of consecutive ticks to confirm entry
confirmation_ticks = 3
# Don't enter if pool utilization is above this (pool is maxed out)
max_utilization = 0.9
# From blueprint: exit section
direction_bias = "neutral"
# Source: placeholder; data-driven versions use cluster-derived clip sizes
clip_size_usd = 1000.0
# Source: placeholder; data-driven versions use cluster-derived hold times
max_hold_secs = 1200
# Tight TP/SL for short-hold LP consumption pattern
# Source: placeholder; data-driven versions use cluster-derived TP/SL
take_profit_pct = 1.0
stop_loss_pct = 0.5
trailing_stop_pct = 0.3
trailing_activation_pct = 0.5
cooldown_after_loss_secs = 300
use_native_tp_sl = true
leverage = 2.5
scale_in_clips = 1

# Flash-Native LP Consumption strategy
# For Flash Trade-only markets (JitoSOL, BONK, SPY) with thin books and high utilization.
# These markets don't exist on Hyperliquid → less competition → LP consumption edge.
# Source: mission SPEC-NEXT-MISSION.md M3
[strategy.flash-native]
# Enable flash-native mode: relaxed thresholds for Flash-only thin-book markets
flash_native_mode = true
# Minimum utilization to consider a flash-native market as a target
# Markets below this don't have enough activity for LP consumption edge
flash_native_min_util_pct = 30.0
# Velocity multiplier for flash-native markets (lower = more sensitive entries)
# Thin books move faster → use 60% of normal threshold
flash_native_velocity_mult = 0.6
# Standard LP consumption parameters (inherited)
consumption_velocity_threshold = 0.5
lp_concentration_min = 0.7
confirmation_ticks = 2
max_utilization = 0.9
direction_bias = "neutral"
clip_size_usd = 500.0
max_hold_secs = 1800
take_profit_pct = 1.5
stop_loss_pct = 0.75
trailing_stop_pct = 0.5
trailing_activation_pct = 0.8
cooldown_after_loss_secs = 300
use_native_tp_sl = true
leverage = 2.5
scale_in_clips = 1

# Mean Reversion Scalper strategy
# Derived from M1 analysis: mean-reversion wallets (oscillating long/short, short holds, tight PnL)
# Exit parameters scaled from: data/strategy-blueprints/swing-trader.json#parameters.exit
[strategy.mean-reversion]
# Number of price points to compute the simple moving average (SMA)
mean_lookback = 120
# Minimum deviation from SMA (%) to detect a "spike"
# Source: placeholder; data-driven version in [strategy.blueprint-mean-revert] uses cluster-004 data
deviation_threshold_pct = 1.5
# Consecutive ticks moving back toward mean to confirm reversal
reversal_confirmation_ticks = 2
# How close to SMA price must return (%) for mean-return exit
mean_tolerance_pct = 0.3
direction_bias = "neutral"
# Source: placeholder; data-driven version uses cluster-004 clip_size_usd=116.6
clip_size_usd = 1000.0
# Source: placeholder; data-driven version uses cluster-004 max_hold_secs=12313
max_hold_secs = 1200
# Source: placeholder; data-driven version uses cluster-004 take_profit_pct=0.4284
take_profit_pct = 1.0
# Source: placeholder; data-driven version uses cluster-004 stop_loss_pct=0.2879
stop_loss_pct = 0.5
# No trailing stop for mean reversion (targets a fixed level, not momentum)
trailing_stop_pct = 0.0
trailing_activation_pct = 0.0
cooldown_after_loss_secs = 300
use_native_tp_sl = true
leverage = 2.0
scale_in_clips = 1

# Trend Follower strategy
# Enters on confirmed momentum breakouts with wider stops and trailing exits.
# Longer holds than scalper strategies. Lower win rate but larger winners.
[strategy.trend-follower]
# Velocity threshold (%) for a "breakout" — higher than scalper (0.15)
# Source: placeholder; see data/blueprints/cluster-003.json, cluster-006.json for data-driven values
breakout_threshold_pct = 0.25
# Consecutive ticks above threshold required to confirm entry
confirmation_ticks = 4
# Minimum price points before any entry signal
min_price_count = 30
direction_bias = "neutral"
# Source: placeholder; data-driven versions use cluster-derived clip sizes
clip_size_usd = 1000.0
# Source: placeholder; data-driven versions use cluster-derived hold times
max_hold_secs = 2400
# Source: placeholder; data-driven versions use cluster-derived TP/SL
take_profit_pct = 2.0
stop_loss_pct = 0.8
trailing_stop_pct = 0.6
trailing_activation_pct = 1.0
cooldown_after_loss_secs = 300
use_native_tp_sl = true
leverage = 3.0
scale_in_clips = 1

# =============================================================================
# DATA-DRIVEN STRATEGIES (from blueprint JSON)
# These strategies use parameters derived from actual profitable HL wallet clusters.
# Data lineage: wallet fills → position_clusters → cluster medians → blueprint JSON → config
# =============================================================================

# Data-Driven Momentum Scalper (from cluster-001)
# Source blueprint: data/blueprints/cluster-001.json
# Cluster: cluster-001, 12 wallets, 4711 trades, confidence 0.73
# Primary market: BTC, Direction: long
# Traceability: wallet fills → position clusters → cluster medians → blueprint → this config
[strategy.blueprint-scalper]
# Velocity threshold (%) for momentum entry
# Source: cluster-001 entry_conditions.parameters.price_velocity_threshold = 0.339
# Derived from: median of 12 wallets' entry velocity patterns, N=4711 trades
momentum_threshold_pct = 0.339
# Number of lookback candles for velocity computation
# Source: cluster-001 entry_conditions.lookback_candles = 6, scaled by tick multiplier 5
lookback_count = 30
# Position clip size in USD
# Source: cluster-001 risk_parameters.clip_size_usd = 63.68
# Derived from: median of 12 wallet median-fill notionals
clip_size_usd = 63.68
# Take-profit threshold (% gain from entry)
# Source: cluster-001 exit_conditions.take_profit_pct = 0.002983 → 0.2983%
# Derived from: median of 632 winning positions' price ranges
take_profit_pct = 0.2983
# Stop-loss threshold (% loss from entry)
# Source: cluster-001 exit_conditions.stop_loss_pct = 0.00141 → 0.141%
# Derived from: median of 376 losing positions' price ranges
stop_loss_pct = 0.141
# Maximum hold duration in seconds
# Source: cluster-001 exit_conditions.max_hold_hours = 2.8134 → 10128s
# Derived from: p75 of 12 wallets' avg_hold_time_hours
max_hold_secs = 10128
# Trailing stop disabled (cluster-001 trailing_stop = false)
trailing_stop_pct = 0.0
trailing_activation_pct = 0.0
# Direction bias from cluster data
# Source: cluster-001 direction = "long"
direction_bias = "long"
scale_in_clips = 1
cooldown_after_loss_secs = 300
use_native_tp_sl = true
leverage = 3.0

# Data-Driven Mean Reversion (from cluster-004)
# Source blueprint: data/blueprints/cluster-004.json
# Cluster: cluster-004, 5 wallets, 518 trades, confidence 0.83
# Primary market: BTC, Direction: mixed
# Traceability: wallet fills → position clusters → cluster medians → blueprint → this config
[strategy.blueprint-mean-revert]
# Number of price points for SMA computation
# Source: cluster-004 entry_conditions.lookback_candles = 6, scaled by tick multiplier 5
mean_lookback = 30
# Minimum deviation from SMA (%) to detect a spike
# Source: cluster-004 entry_conditions.parameters.price_velocity_threshold = 1.009
# Derived from: median of 5 wallets' entry velocity patterns, N=518 trades
deviation_threshold_pct = 1.009
# Consecutive reversal ticks to confirm entry
reversal_confirmation_ticks = 2
# How close to SMA price must return (%) for mean-return exit
mean_tolerance_pct = 0.3
# Position clip size in USD
# Source: cluster-004 risk_parameters.clip_size_usd = 116.6
# Derived from: median of 5 wallet median-fill notionals
clip_size_usd = 116.6
# Take-profit threshold (% gain from entry)
# Source: cluster-004 exit_conditions.take_profit_pct = 0.004284 → 0.4284%
# Derived from: median of 241 winning positions' price ranges
take_profit_pct = 0.4284
# Stop-loss threshold (% loss from entry)
# Source: cluster-004 exit_conditions.stop_loss_pct = 0.002879 → 0.2879%
# Derived from: median of 114 losing positions' price ranges
stop_loss_pct = 0.2879
# Maximum hold duration in seconds
# Source: cluster-004 exit_conditions.max_hold_hours = 3.4203 → 12313s
# Derived from: p75 of 5 wallets' avg_hold_time_hours
max_hold_secs = 12313
# No trailing stop for mean reversion (targets a fixed level: the mean)
trailing_stop_pct = 0.0
trailing_activation_pct = 0.0
# Direction bias from cluster data (mixed = trade both directions)
# Source: cluster-004 direction = "mixed"
direction_bias = "neutral"
scale_in_clips = 1
cooldown_after_loss_secs = 300
use_native_tp_sl = true
leverage = 3.0

[risk]
max_position_notional_usd = 5000.0
max_daily_loss_usd = 500.0
max_drawdown_pct = 15.0
# Maximum total notional exposure across ALL open positions (cross-cell limit).
# With 4 strategies × 2 markets, each at ~$3000, total could reach $24,000+.
# Set a cap to prevent excessive exposure from accumulating.
max_total_notional_usd = 100000.0

# =============================================================================
# ALPHA SCANNER — Wallet discovery configuration
# =============================================================================

[alpha-scanner]
# Dextrabot discover-wallets API base URL
dextrabot_url = "https://dextradata.nftinit.io"
# Minimum 7-day Sharpe ratio for wallet candidates
min_sharpe_7d = 1.5
# Minimum 30-day Sharpe ratio for wallet candidates
min_sharpe_30d = 2.0
# Minimum 30-day PnL in USD for wallet candidates
min_pnl_30d = 5000
# Number of top wallets to include in watchlist
watchlist_size = 20
# Daemon refresh interval in seconds (6 hours)
refresh_interval_secs = 21600
# Output file path for ranked watchlist JSON
output_path = "data/watchlist.json"

# =============================================================================
# COPY TRADER — Position mirroring configuration
# =============================================================================

[copy-trader]
# Polling interval for wallet position checks (seconds)
poll_interval_secs = 30
# Maximum position size as percentage of account balance
max_position_pct = 10.0
# Maximum number of concurrent mirrored positions
max_positions = 3
# Stop-loss percentage for mirrored positions
stop_loss_pct = 5.0
# Delay before mirroring a detected position (seconds)
lag_secs = 30
# Position sizing multiplier: our_size = whale_size * multiplier
sizing_multiplier = 0.1
# Output file path for copy trade log JSON
output_path = "data/copy-trades.json"

# =============================================================================
# WHALE WATCHER — Real-time whale monitoring configuration
# =============================================================================

[whale-watcher]
# Minimum position notional (USD) to trigger an alert
min_notional_usd = 10000
# Window for alert accuracy follow-up check (seconds, 1h)
accuracy_window_secs = 3600
# Output file path for whale alerts JSON
output_path = "data/whale-alerts.json"

# =============================================================================
# HYPURRSCAN — API configuration
# =============================================================================

[hypurrscan]
# Environment variable name holding the JWT token
jwt_env_var = "HYPURRSCAN_JWT"
# Environment variable name holding the refresh token
refresh_token_env_var = "HYPURRSCAN_REFRESH_TOKEN"
# Hypurrscan API base URL
base_url = "https://api.hypurrscan.io"
# JWT refresh endpoint URL
refresh_url = "https://hypurrscan.io/api/auth/refresh"

# =============================================================================
# FUNDING RATE CAPTURE STRATEGY
# =============================================================================

[strategy.funding-capture]
# Minimum annualized funding rate (%) to trigger entry
# Raised from 10.0 to 15.0 — only enter when funding is genuinely high
min_annualized_rate_pct = 15.0
# Exit when annualized funding rate drops below this (%)
exit_annualized_rate_pct = 3.0
# Maximum position hold time (hours)
max_position_hours = 72
# Leverage for funding capture positions
leverage = 1.0
# Position clip size in USD
# Increased from 50.0 to 100.0 — better fee ratio (fees are fixed %)
clip_size_usd = 100.0
# Stop-loss percentage — default/floor for funding capture
stop_loss_pct = 3.0
# Minimum hold time (minutes) before stop-loss activates — gives funding time to accrue
min_hold_before_sl_mins = 120

# =============================================================================
# PIPELINE — Orchestrator configuration
# =============================================================================

[pipeline]
# Default paper balance for pipeline paper trading
paper_balance = 1000.0
# Combined PnL report generation interval (seconds)
report_interval_secs = 300
# Alpha-scanner refresh interval (seconds, 6 hours)
scanner_refresh_secs = 21600
# Default strategies for pipeline paper trading
strategies = "funding-capture"
# Default markets for pipeline paper trading
markets = "BTC"
# Combined PnL report output path
combined_output = "data/combined-pnl.json"

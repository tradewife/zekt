[package]
name = "zekt"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[[bin]]
name = "zekt"
path = "src/main.rs"

[[bin]]
name = "scrape-leaderboards"
path = "src/bin/scrape-leaderboards.rs"

[[bin]]
name = "analyze-wallet"
path = "src/bin/analyze-wallet.rs"

[[bin]]
name = "scan-markets"
path = "src/bin/scan-markets.rs"

[[bin]]
name = "alpha-scanner"
path = "src/bin/alpha-scanner.rs"

[[bin]]
name = "copy-trader"
path = "src/bin/copy-trader.rs"

[[bin]]
name = "whale-watcher"
path = "src/bin/whale-watcher.rs"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Solana
solana-sdk = "2.2"
solana-client = "2.2"
spl-associated-token-account = "6"
spl-token = "7"

# Encoding
bs58 = "0.5"
base64 = "0.22"
bincode = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utils
dashmap = "6"
rand = "0.9"
ctrlc = "3"
scraper = "0.27.0"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
